# Спецификация XcodeGen: `xcodegen generate` создаёт RayBanClaude.xcodeproj.
name: RayBanClaude
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  developmentLanguage: ru

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  ClaudeKit:
    path: Packages/ClaudeKit

settings:
  base:
    # Свой Apple Developer Team ID (Xcode → Signing & Capabilities). Нужен и для подписи, и для MWDAT > TeamID.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RayBanClaude:
    type: application
    platform: iOS
    sources:
      - path: RayBanClaude
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.raybanclaude
        PRODUCT_NAME: RayBanClaude
        INFOPLIST_FILE: RayBanClaude/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: RayBanClaude/App/RayBanClaude.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Режим языка Swift 5: проверки параллелизма выводятся предупреждениями, а не ошибками.
        # Ядро ClaudeKit собрано в строгом режиме Swift 6.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Режим разработчика Meta AI: без App ID проверка подлинности пропускается.
        META_APP_ID: "0"
        CLIENT_TOKEN: ""
    dependencies:
      - package: ClaudeKit
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice

schemes:
  RayBanClaude:
    build:
      targets:
        RayBanClaude: all
    run:
      config: Debug
    archive:
      config: Release
