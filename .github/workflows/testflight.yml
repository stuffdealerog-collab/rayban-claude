# Сборка, подпись и загрузка в TestFlight без своего Mac. Запуск вручную: Actions → TestFlight → Run workflow.
# Подпись — через App Store Connect API (codemagic-cli-tools): сертификат и профиль создаются автоматически.
# Нужные переменные и секреты описаны в README.md, раздел «TestFlight без Xcode».
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Сборка и загрузка в TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_APPLE_ID: ${{ vars.APP_STORE_APPLE_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить настройки
        run: |
          missing=0
          for name in BUNDLE_ID APP_STORE_APPLE_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                      APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Не задано $name (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Выбрать Xcode
        run: scripts/ci/select-xcode.sh

      - name: Установить инструменты
        run: |
          brew install xcodegen
          # Python на раннере «externally managed» — ставим CLI в отдельное окружение.
          python3 -m venv "$RUNNER_TEMP/codemagic"
          "$RUNNER_TEMP/codemagic/bin/pip" install --quiet codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic/bin" >> "$GITHUB_PATH"

      - name: Подготовить проект (Bundle ID, команда, номер сборки)
        run: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 || true)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          BUILD=$((LATEST + 1))
          echo "Номер сборки: $BUILD"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.example.raybanclaude/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          if [[ -n "$APPLE_TEAM_ID" ]]; then
            sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$APPLE_TEAM_ID\"/" project.yml
          fi
          grep -nE "PRODUCT_BUNDLE_IDENTIFIER|CURRENT_PROJECT_VERSION|DEVELOPMENT_TEAM" project.yml
          xcodegen generate

      - name: Подпись (сертификат и профиль через App Store Connect API)
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project RayBanClaude.xcodeproj

      - name: Собрать IPA
        run: xcode-project build-ipa --project RayBanClaude.xcodeproj --scheme RayBanClaude

      - name: Загрузить в TestFlight
        run: |
          IPA=$(find "$GITHUB_WORKSPACE/build" -name "*.ipa" | head -1)
          if [[ -z "$IPA" ]]; then echo "::error::IPA не найден"; exit 1; fi
          echo "Загружаю $IPA"
          app-store-connect publish --path "$IPA"

      - name: Логи сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: /tmp/xcodebuild_logs/
          if-no-files-found: ignore
